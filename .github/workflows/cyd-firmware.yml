name: cyd-firmware

# Builds the examples/cyd firmware for the ESP32-2432S028R "Cheap Yellow
# Display" and attaches it to each published release, so it can be flashed
# without setting up the Arduino toolchain. Pull requests that touch it build
# it too (as a workflow artifact), so it's known to build before a release.

on:
  release:
    types: [published]
  pull_request:
    paths:
      - "examples/cyd/**"
      - "src/**"
      - ".github/workflows/cyd-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned, so a release's firmware doesn't depend on whichever core is newest
  ESP32_CORE: "3.3.12"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # To attach the firmware to the release
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache arduino-cli data
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: ${{ runner.os }}-arduino-cli-cyd-firmware-${{ env.ESP32_CORE }}
      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 board package
        run: |
          arduino-cli config init --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json --overwrite
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE}"
      - name: Install library dependencies
        run: |
          arduino-cli lib install ArduinoJson TFT_eSPI XPT2046_Touchscreen PNGdec WiFiManager
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install --git-url https://github.com/ESP32Async/AsyncTCP.git
          arduino-cli lib install --git-url https://github.com/ESP32Async/ESPAsyncWebServer.git
      - name: Install the CYD's TFT_eSPI setup
        # TFT_eSPI only reads its settings from its own User_Setup.h (see the top of cyd.ino)
        run: cp examples/cyd/User_Setup_CYD.h ~/Arduino/libraries/TFT_eSPI/User_Setup.h
      - name: Build
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --library . --output-dir build examples/cyd
      - name: Name the binaries
        # The release tag, or the commit for other builds
        env:
          VERSION: ${{ github.event.release.tag_name || github.sha }}
        run: |
          mkdir -p firmware
          # Bootloader, partition table and app in one image, flashed at 0x0
          cp build/cyd.ino.merged.bin "firmware/companion-cyd-${VERSION}.bin"
          # Just the app, for updating a board that already runs it (flashed at 0x10000)
          cp build/cyd.ino.bin "firmware/companion-cyd-${VERSION}-app.bin"
          ls -l firmware
      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-cyd-firmware
          path: firmware/
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" firmware/* --clobber

name: static-analysis

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache pip and platformio
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PlatformIO
        # 6.2.0 bundles SCons 4.11, which dropped SCons.Tool.FortranCommon that the
        # pinned pioarduino platform still imports - stay on 6.1.x (SCons 4.8)
        run: pip install "platformio==6.1.19"
      - name: Setup git for private libraries
        # Only needed when GH_PAT is configured for private dependencies; without
        # it, gh fails with "not logged in" and every dependency here is public.
        if: env.GH_TOKEN != ''
        run: gh auth setup-git
      - name: Run PlatformIO
        # examples/basic is a plain Arduino IDE sketch (no platformio.ini);
        # examples/pio-exhaustive is the PlatformIO project, so it's what pio check analyzes.
        # -v so a tool failure ("cppcheck failed to perform check!") shows its output
        run: pio check -v -d examples/pio-exhaustive

  lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0

      - name: Super-linter
        uses: super-linter/super-linter@v7.4.0 # x-release-please-version
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Linter configs (.clang-format, .jscpd.json...) live in .github/linters.
          # cpplint enforces Google style, which this repo doesn't follow (clang-format
          # checks the repo's own style instead), and textlint's terminology rules
          # don't suit the docs.
          VALIDATE_CPP: false
          VALIDATE_NATURAL_LANGUAGE: false
          # Copied verbatim from Companion, so kept byte-for-byte
          FILTER_REGEX_EXCLUDE: test/host/satellite-protocol-corpus\.json

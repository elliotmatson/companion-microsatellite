; PlatformIO Project Configuration File
;
; Exhaustive feature-coverage example for the CompanionSatellite library.
; It builds against the library in the repository root via
; `lib_deps = symlink://../..`, so it always tracks the local library source
; rather than a published copy. Unlike examples/basic, this example is a
; serial-driven test harness (no NeoPixels/physical buttons), so the same
; code builds unmodified across every WiFi-capable ESP32 variant below -
; that's also what the build-examples.yml CI matrix builds.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = CompanionSatellite Exhaustive Example
description = Serial console test harness exercising every public API of the CompanionSatellite library

[env]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    symlink://../..
    ; The mixed arduino+espidf framework doesn't chain the library's own
    ; dependencies (declared in ../../library.json) through the symlink
    ; above, so they're listed explicitly here too.
    ESP32Async/ESPAsyncWebServer@^3.12.0
    ESP32Async/AsyncTCP@^3.5.0
    bblanchon/ArduinoJson@^7.4.3

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino, espidf
board = esp32dev

[env:esp32s2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino, espidf
board = esp32-s2-saola-1

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino, espidf
board = esp32-s3-devkitc-1

[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino, espidf
board = esp32-c3-devkitm-1

[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino, espidf
board = esp32-c6-devkitc-1

name=Companion microSatellite
version=1.0.0
author=Elliot Matson <https://github.com/elliotmatson>
maintainer=Elliot Matson <https://github.com/elliotmatson>
sentence=Connect ESP32 microcontrollers to Bitfocus Companion via the Companion Satellite API.
paragraph=Turns an ESP32 into a virtual Stream Deck-style surface for Bitfocus Companion: virtual button surfaces with bitmaps/colors/text, layout manifests with per-control styles and LED rings, rotary encoders with step counts, pincode input, button subscriptions, and variables. Requires Companion Satellite API version 1.10.0 or later (Companion v4.3+).
category=Communication
url=https://github.com/elliotmatson/companion-microsatellite
architectures=esp32
depends=ArduinoJson (>=7.4.3), Async TCP (>=3.5.0), ESP Async WebServer (>=3.12.0)
includes=companion-satellite.hpp
